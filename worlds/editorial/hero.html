<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{brand}}</title>
<style>
{{fonts}}
{{tokens}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-text);background:var(--bg);color:var(--ink);min-height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
.page{position:relative;min-height:100vh;padding:0 clamp(24px,5vw,88px);display:flex;flex-direction:column}
header{display:flex;align-items:baseline;justify-content:space-between;padding:30px 0 22px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-style:italic;font-size:30px;letter-spacing:-.01em}
nav{display:flex;gap:36px;font-size:15px;color:var(--muted)}
nav a{color:inherit;text-decoration:none}
.top-cta{font-size:15px;font-weight:500;border-bottom:1px solid var(--ink);padding-bottom:2px}
main{flex:1;display:grid;grid-template-columns:repeat(12,1fr);column-gap:24px;align-content:start;padding-top:clamp(36px,7vh,88px)}
h1{grid-column:1 / span 10;font-family:var(--font-display);font-weight:400;font-size:clamp(56px,10.4vw,176px);line-height:.9;letter-spacing:-.025em}
h1 .line{display:block}
h1 .line:last-child{font-style:italic;color:var(--accent)}
.meta{grid-column:1 / -1;display:grid;grid-template-columns:repeat(12,1fr);column-gap:24px;margin-top:clamp(28px,5vh,64px);padding-top:26px;border-top:1px solid var(--ink);align-items:start}
.sub{grid-column:3 / span 6;font-size:clamp(17px,1.5vw,21px);line-height:1.55;color:var(--ink);max-width:34em}
.action{grid-column:9 / span 4;justify-self:end}
.cta{display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);font-weight:500;font-size:17px;padding:18px 26px;border-radius:var(--radius)}
.cta i{font-style:normal;color:var(--accent)}
.mark{position:absolute;left:0;right:0;bottom:-0.2em;text-align:center;font-family:var(--font-display);font-size:clamp(120px,24vw,420px);line-height:1;letter-spacing:-.03em;color:transparent;-webkit-text-stroke:1px var(--line);white-space:nowrap;pointer-events:none;z-index:0}
main,header{position:relative;z-index:1}
@media (max-width:767px){
  nav,.top-cta{display:none}
  header{padding:22px 0 16px}
  .brand{font-size:26px}
  main{padding-top:36px}
  h1{grid-column:1 / -1;font-size:clamp(52px,17vw,84px)}
  .meta{margin-top:30px;row-gap:16px}
  .sub{grid-column:1 / -1}
  .action{grid-column:1 / -1;justify-self:start;margin-top:8px}
  .mark{font-size:44vw}
}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="brand">{{brand}}</div>
    <nav>{{nav}}</nav>
    <div class="top-cta">{{cta}}</div>
  </header>
  <main>
    <h1>{{headline}}</h1>
    <div class="meta">
      <p class="sub">{{sub}}</p>
      <div class="action"><span class="cta">{{cta}} <i>&rarr;</i></span></div>
    </div>
  </main>
  <div class="mark">{{brand}}</div>
</div>
</body>
</html>
